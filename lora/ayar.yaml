# mlx_lm lora ayarı (16 GB MacBook Air M4). egit.sh bunu -c ile okur; komut satırı bayrakları üstüne yazar.
model: mlx-community/Qwen2.5-Coder-0.5B-Instruct-4bit
train: true
fine_tune_type: lora
data: lora/veri
adapter_path: lora/adaptor
num_layers: 16
batch_size: 4
iters: 600
learning_rate: 1.0e-4
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true          # kayıp yalnız cevap ({"ad": ...}) üzerinde
steps_per_report: 10
steps_per_eval: 100
val_batches: 25
save_every: 100
seed: 7
